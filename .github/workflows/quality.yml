name: NH MCP Quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: Compile TypeScript
        run: npm run build
      - name: Offline regression suite
        run: node --test scripts/*.test.mjs
      - name: Guard trading-disabled policy
        run: |
          node --input-type=module - <<'JS'
          import {readFileSync} from 'node:fs';
          const source=readFileSync('src/config.ts','utf8');
          if(!source.includes('enableTrading: false'))process.exit(1);
          console.log('Read-only trading policy PASS');
          JS
